<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Jeopardy – Vereinsquiz</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Jeopardy</h1>

  <table id="board">
    <caption>Vereinsquiz</caption>
  </table>

  <div class="overlay" id="overlay">
    <div class="modal">
      <p class="clue" id="modal-clue"></p>
      <p class="answer" id="modal-answer"></p>
      <button id="btn-reveal">Antwort zeigen</button>
      <button id="btn-close">Schließen</button>
    </div>
  </div>

  <table id="score-board">
    <caption>Aktueller Stand</caption>
  </table>
  
  <script src="script.js"></script>
</body>

</html>
